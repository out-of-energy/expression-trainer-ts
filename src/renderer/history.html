<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>训练历史</title>
  <style>
    :root {
      --bg: #FAF9F5;
      --bg-elevated: #FFFFFF;
      --surface: #F0EEE6;
      --border: #E8E6DF;
      --border-strong: #D8D5CA;
      --text: #1F1E1D;
      --text-2: #6E6A60;
      --text-3: #9A958A;
      --accent: #D97757;
      --accent-hover: #C15F3C;
      --accent-soft: #F5E7DF;
      --green: #4E7A57;
      --amber: #A97E2F;
      --rose: #B5654A;
      --serif: Georgia, "Times New Roman", "Songti SC", "Noto Serif SC", serif;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .hidden { display: none !important; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-app-region: drag;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-elevated);
      flex: none;
    }
    .topbar h1 { font-family: var(--serif); font-size: 18px; font-weight: 600; }
    .topbar-right { display: flex; gap: 8px; -webkit-app-region: no-drag; }
    button {
      font-family: var(--sans);
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-strong);
      background: var(--bg-elevated);
      color: var(--text);
      cursor: pointer;
      -webkit-app-region: no-drag;
    }
    button:hover { border-color: var(--accent); color: var(--accent); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.primary:hover { background: var(--accent-hover); color: #fff; }
    button.danger:hover { border-color: #B03A2E; color: #B03A2E; }

    /* 滚动容器必须 no-drag：-webkit-app-region: drag 会拦截滚轮事件导致无法滚动 */
    .container { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 24px; -webkit-app-region: no-drag; }
    .empty {
      text-align: center;
      color: var(--text-3);
      padding: 80px 0;
      font-size: 14px;
    }

    /* ===== 列表 ===== */
    .record-item {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: border-color .15s;
      -webkit-app-region: no-drag;
    }
    .record-item:hover { border-color: var(--accent); }
    .record-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .record-time { font-weight: 600; font-size: 14px; }
    .badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent-hover);
    }
    .badge.pasted { background: #E8EFE9; color: var(--green); }
    .record-stats { display: flex; gap: 14px; margin-top: 6px; font-size: 12px; color: var(--text-2); flex-wrap: wrap; }
    .record-stats b { color: var(--text); font-weight: 600; }
    .record-preview {
      margin-top: 6px;
      font-size: 13px;
      color: var(--text-2);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ===== 详情 ===== */
    .detail-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      -webkit-app-region: no-drag;
    }
    .detail-title { font-family: var(--serif); font-size: 16px; font-weight: 600; flex: 1; }
    .section {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }
    .section h3 { font-size: 13px; color: var(--text-2); margin-bottom: 10px; font-weight: 600; }
    .transcript {
      font-size: 15px;
      line-height: 1.9;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .stat-cell { background: var(--surface); border-radius: 8px; padding: 10px 12px; }
    .stat-cell .label { font-size: 11px; color: var(--text-3); }
    .stat-cell .value { font-size: 18px; font-weight: 700; margin-top: 2px; }
    .stat-cell .value.green { color: var(--green); }
    .stat-cell .value.amber { color: var(--amber); }
    .stat-cell .value.rose { color: var(--rose); }
    .word-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-2);
    }
    .chip b { color: var(--text); }
    .chip.vague { border-color: #B8D3BC; background: #E8EFE9; color: var(--green); }
    .chip.filler { border-color: #E6C3B8; background: #F5E9E4; color: var(--rose); }
    .chip.hedge { border-color: #E2D3AE; background: #F5EEDD; color: var(--amber); }
    .suggestion-item { font-size: 13px; padding: 6px 0; border-bottom: 1px dashed var(--border); color: var(--text-2); }
    .suggestion-item:last-child { border-bottom: none; }
    .report-body { font-size: 14px; line-height: 1.8; }
    .report-body h1, .report-body h2, .report-body h3 { font-family: var(--serif); margin: 14px 0 8px; }
    .report-body p, .report-body li { margin-bottom: 6px; }
    .report-body blockquote { border-left: 3px solid var(--accent); padding-left: 12px; color: var(--text-2); margin: 8px 0; }
    .report-body table { border-collapse: collapse; margin: 8px 0; font-size: 13px; }
    .report-body th, .report-body td { border: 1px solid var(--border-strong); padding: 4px 10px; }

    /* 词库高亮（与主界面一致） */
    .vague { color: var(--green); text-decoration: underline dotted #4E7A57; }
    .filler { color: var(--rose); text-decoration: underline wavy #B5654A; }
    .hedge { color: var(--amber); }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>🕘 训练历史</h1>
    <div class="topbar-right">
      <button id="btn-refresh">↻ 刷新</button>
    </div>
  </div>

  <div id="view-list" class="container">
    <div id="history-list"></div>
  </div>

  <div id="view-detail" class="container hidden">
    <div class="detail-header">
      <button id="btn-back">← 返回</button>
      <span id="detail-title" class="detail-title"></span>
      <button id="btn-export" class="primary">💾 导出</button>
      <button id="btn-delete" class="danger">🗑️ 删除</button>
    </div>
    <div id="detail-content"></div>
  </div>

  <script src="history.js"></script>
</body>
</html>
