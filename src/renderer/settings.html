<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>设置</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      background: #FAF9F5;
      color: #1F1E1D;
      padding: 44px 36px 32px;
      display: block;
      overflow-y: auto;
      -webkit-app-region: drag;
    }

    .settings-container {
      -webkit-app-region: no-drag;
      max-width: 420px;
      margin: 0 auto;
    }

    h1 {
      font-family: Georgia, "Times New Roman", "Songti SC", serif;
      font-size: 22px;
      font-weight: 500;
      margin-bottom: 28px;
      color: #1F1E1D;
      letter-spacing: 0.3px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: #6E6A60;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .form-group select,
    .form-group input {
      width: 100%;
      padding: 10px 14px;
      background: #FFFFFF;
      border: 1px solid #D8D5CA;
      border-radius: 10px;
      color: #1F1E1D;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }

    .form-group select:focus,
    .form-group input:focus {
      border-color: #D97757;
    }

    .form-group input::placeholder {
      color: #9A958A;
    }

    .form-group .hint {
      font-size: 12px;
      color: #9A958A;
      margin-top: 5px;
    }

    .conditional {
      display: none;
    }

    .conditional.visible {
      display: block;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 24px;
    }

    .btn-save {
      flex: 1;
      padding: 12px;
      background: #D97757;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-cancel {
      flex: 1;
      padding: 12px;
      background: #FFFFFF;
      color: #6E6A60;
      border: 1px solid #D8D5CA;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-cancel:hover {
      border-color: #9A958A;
      color: #1F1E1D;
    }

    .model-load-row {
      display: flex;
      gap: 8px;
    }

    .model-load-row input {
      flex: 1;
      background: #F0EEE6;
      color: #6E6A60;
      cursor: default;
    }

    .btn-load-model {
      padding: 10px 16px;
      background: #FFFFFF;
      color: #D97757;
      border: 1px solid #D97757;
      border-radius: 10px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .btn-load-model:hover:not(:disabled) {
      background: #F5E7DF;
    }

    .btn-load-model:disabled {
      opacity: 0.55;
      cursor: default;
      color: #6E6A60;
      border-color: #D8D5CA;
    }

    .btn-save:hover {
      background: #C15F3C;
    }

    .message-container {
      position: relative;
      height: 20px;
      margin-top: 12px;
    }

    .save-success {
      position: absolute;
      left: 0;
      right: 0;
      text-align: center;
      color: #4E7A57;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .save-success.show {
      opacity: 1;
    }

    .connection-error {
      position: absolute;
      left: 0;
      right: 0;
      text-align: center;
      color: #B03A2E;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.3s;
      word-break: break-all;
    }

    .connection-error.show {
      opacity: 1;
    }

    .model-presets {
      font-size: 12px;
      color: #9A958A;
      margin-top: 5px;
    }

    .btn-save.loading {
      opacity: 0.6;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="settings-container">
    <h1>⚙️ 设置</h1>

    <div class="form-group">
      <label>AI 后端</label>
      <select id="provider">
        <option value="openai">OpenAI</option>
        <option value="deepseek">DeepSeek（推荐）</option>
        <option value="ollama">Ollama（本地）</option>
        <option value="custom">自定义 OpenAI 兼容</option>
      </select>
    </div>

    <div class="form-group conditional" id="group-apikey">
      <label>API Key</label>
      <input type="password" id="apikey" placeholder="输入你的 API Key">
      <div class="hint" id="apikey-hint">在 platform.deepseek.com 获取</div>
    </div>

    <div class="form-group">
      <label>模型</label>
      <select id="model">
        <!-- 动态填充 -->
      </select>
      <div class="model-presets" id="model-hint"></div>
    </div>

    <div class="form-group conditional" id="group-ollama">
      <label>Ollama 地址</label>
      <input type="text" id="ollama-url" placeholder="http://localhost:11434">
    </div>

    <div class="form-group conditional" id="group-custom">
      <label>OPENAI 协议 BASE URL</label>
      <input type="text" id="custom-base-url" placeholder="https://api.example.com/v1">
      <div class="hint">请求时会自动追加 /chat/completions</div>
    </div>

    <div class="form-group conditional" id="group-custom-model">
      <label>自定义模型名</label>
      <input type="text" id="custom-model" placeholder="model-name">
    </div>

    <div class="form-group">
      <label>本地离线语音模型</label>
      <div class="model-load-row">
        <input type="text" id="asr-model-path" readonly placeholder="未加载">
        <button class="btn-load-model" id="btn-load-model">加载</button>
      </div>
      <div class="hint">语音识别（ASR）模型。未加载时，开始录制会提示先到此处加载。</div>
    </div>

    <div class="message-container">
      <div class="save-success" id="save-success">✓ 已保存</div>
      <div class="connection-error" id="connection-error"></div>
    </div>
    <div class="btn-row">
      <button class="btn-cancel" id="btn-cancel">取消</button>
      <button class="btn-save" id="btn-save">保存设置</button>
    </div>
  </div>

  <script src="settings.js"></script>
</body>
</html>
